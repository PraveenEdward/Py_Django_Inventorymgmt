services:
  mysql:
    container_name: mysql
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: toor
      MYSQL_DATABASE: django
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    container_name: django
    image: django:v1.0
    depends_on:
      mysql:
        condition: service_healthy
  
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - /home/ubuntu/Py_Django_Inventorymgmt/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - django
